<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EmpireMarv – Echtzeitstrategie über 18 Epochen der Menschheitsgeschichte." />
    <title>EmpireMarv</title>
  </head>
  <body>
    <div id="app">
      <p id="boot-hint" style="position: fixed; inset: 0; margin: 0; padding: 24px; display: grid; place-items: center; text-align: center; font: 15px system-ui, sans-serif; color: #8a8170">
        EmpireMarv wird geladen … Bleibt diese Meldung stehen, konnte das Spiel nicht starten (siehe README, Abschnitt „Veröffentlichen“).
      </p>
      <canvas id="game"></canvas>
      <div id="hud" hidden>
        <div id="topbar">
          <div id="resources"></div>
          <div class="top-group"><span class="label">Bevölkerung</span> <span id="pop"></span></div>
          <button id="btn-idle" class="top-group idle-btn" title="Nächster untätiger Bürger (.)">Untätig <span id="idle-count">0</span></button>
          <div id="epoch" class="top-group"></div>
          <div id="clock" class="top-group"></div>
          <div class="top-buttons">
            <button id="btn-tech" title="Technologiebaum (F2)">Forschung</button>
            <button id="btn-sound" title="Ton ein/aus (Strg+M) – Lautstärke im Menü">🔊</button>
            <button id="btn-pause" title="Pause (P)">❚❚</button>
            <button id="btn-menu" title="Menü (Esc)">Menü</button>
          </div>
        </div>
        <div id="messages"></div>
        <div id="groups" hidden></div>
        <div id="prodbar" hidden></div>
        <div id="bottombar">
          <div id="minimap-wrap"><canvas id="minimap"></canvas></div>
          <div id="selection"></div>
          <div id="commands"></div>
        </div>
        <div id="tooltip" hidden></div>
        <div id="selbox" hidden></div>
      </div>
      <div id="overlay" hidden></div>
      <div id="menu" hidden></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
